# push / PR のたびに GitHub 上で自動チェックする。
# 失敗するとコミット一覧・PR に赤印が付く（壊れた main を防ぐ）。
name: CI

on:
  push:
    branches: [main, feature-update, "feature/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: テスト
        run: npm test

      - name: 型チェック + ビルド
        run: npm run build

      # 画面を実際に操作して確かめる（扉・窓の選択、階段の取っ手、出力、続きから編集など）
      - name: 画面操作テスト用のブラウザ
        run: npx playwright install --with-deps chromium

      - name: 画面操作テスト
        run: npm run test:e2e

      - name: 画面操作テストの結果（失敗したときだけ）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
